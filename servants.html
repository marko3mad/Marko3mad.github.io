<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>تواصل مع الخدام</title><style>
:root{--ink:#292421;--muted:#756d66;--paper:#faf8f5;--card:#fff;--accent:#7d5f48;--accent2:#efe5da}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:620px;margin:auto;padding:18px 16px 40px}
header{text-align:center;padding:12px 8px 10px}.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #e3c47a;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.10)}
h1{font-size:27px;line-height:1.35;margin:8px 0 2px}.subtitle{font-size:16px;color:var(--muted);margin:0}.areas{font-size:14px;color:var(--muted)}
.section-title{font-size:21px;margin:24px 4px 10px}.meeting{background:var(--accent);color:#fff;border-radius:20px;padding:20px}
.meeting .label{font-size:15px;opacity:.9}.meeting h2{font-size:23px;margin:3px 0 8px}.meeting p{margin:3px 0}
.btn,.card{display:block;text-align:center;text-decoration:none}.btn{background:#fff;color:var(--ink);font-weight:bold;border-radius:12px;padding:11px 14px;margin-top:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid #eee6de;border-radius:17px;padding:18px 12px;color:var(--ink);box-shadow:0 3px 14px rgba(0,0,0,.04)}
.icon{font-size:30px;display:block;margin-bottom:3px}.card strong{display:block;font-size:16px}.card small{color:var(--muted)}
.back{display:inline-block;margin:4px 0 14px;text-decoration:none;color:var(--accent);font-weight:bold}.list{display:flex;flex-direction:column;gap:12px}
.item{background:#fff;border:1px solid #eee6de;border-radius:17px;padding:16px}.item h3{margin:0 0 4px;font-size:19px}.item p{margin:0;color:var(--muted);font-size:14px}.item a{display:block;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;text-align:center;border-radius:10px;padding:9px;font-weight:bold}
.contact{background:var(--accent2);border-radius:17px;padding:16px}.person{padding:11px 0;border-bottom:1px solid rgba(125,95,72,.18)}.person:last-child{border:0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">

</header><a class="back" href="index.html">← العودة للصفحة الرئيسية</a><h2 class="section-title">📞 تواصل معانا</h2><div class="contact">
